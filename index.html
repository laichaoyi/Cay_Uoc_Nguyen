<style>
  :root {

  /* opening */

    background: rgba(20, 28, 22, 0.28); transition: background .4s, border-color .4s, padding .5s; animation: invite 3.4s ease-in-out infinite; }

  html:is([lang="en"], [lang="vi"]) #who { font-family: var(--latin); font-size: 18px; letter-spacing: 0.03em; } html:is([lang="en"], [lang="vi"]) #who input { letter-spacing: 0.04em; }
  body.phone #intro { cursor: default; }
  @media (max-width: 600px), (pointer: coarse) {
    #intro { overflow-y: auto; }
    #intro .col, html:is([lang="en"], [lang="vi"]) #intro .col { flex-direction: column; align-items: flex-start; margin-top: auto; width: 100%; gap: 20px; }
    #intro h1 { writing-mode: horizontal-tb; font-size: 48px; }
    #intro .side { gap: 16px; width: 100%; }
    #desktopNotice { display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; border: 1px solid rgba(207, 227, 164, .55); border-left: 3px solid var(--leaf); background: rgba(8, 18, 10, .86); border-radius: 4px; cursor: default; }
    #desktopTitle { color: var(--leaf); font-size: 17px; font-weight: 600; line-height: 1.5; }
    #desktopDetail { color: var(--ink); font-size: 13px; line-height: 1.7; }
    #desktopCopy { align-self: flex-start; margin-top: 6px; padding: 9px 14px; border: 1px solid rgba(207, 227, 164, .7); border-radius: 3px; background: transparent; color: var(--leaf); font: inherit; font-size: 13px; letter-spacing: 0.08em; cursor: pointer; }
    html:is([lang="en"], [lang="vi"]) #desktopNotice { font-family: var(--latin); }

  /* captions: what just happened, said once, quietly */
  #cap { position: fixed; left: clamp(24px, 6vw, 84px); bottom: var(--above-hud); max-width: min(30em, calc(80vw - var(--bench-w))); font-size: clamp(16px, 1.5vw, 22px); letter-spacing: 0.14em; line-height: 1.8;
    text-shadow: 0 1px 18px rgba(0, 0, 0, 0.75), 0 0 2px rgba(0, 0, 0, 0.5); opacity: 0; transition: opacity 2.4s ease; pointer-events: none; }
  html:is([lang="en"], [lang="vi"]) #cap { font-family: var(--latin); font-style: italic; letter-spacing: 0.02em; font-size: clamp(19px, 1.8vw, 26px); }

  #treeSay { position: fixed; left: 50%; top: 61%; transform: translateX(-50%); width: max-content; max-width: min(24em, 84vw); text-align: center; font-size: clamp(20px, 2.1vw, 30px); letter-spacing: 0.24em; line-height: 2; color: #fff7e2; text-shadow: 0 0 22px rgba(255, 232, 180, 0.5), 0 1px 14px rgba(0, 0, 0, 0.65); opacity: 0; transition: opacity 2.8s ease; pointer-events: none; z-index: 5; }
  #treeSay.show { opacity: 0.97; }
  html:is([lang="en"], [lang="vi"]) #treeSay { font-family: var(--latin); font-style: italic; letter-spacing: 0.05em; font-size: clamp(22px, 2.3vw, 32px); }
  body.nocap #cap:not(.reply) { display: none; }

  #guide { position: fixed; left: clamp(24px, 6vw, 84px); bottom: var(--above-hud); max-width: min(32em, calc(84vw - var(--bench-w))); display: flex; flex-direction: column; gap: 16px; align-items: flex-start;
    opacity: 0; transition: opacity 1.1s ease; pointer-events: none; text-shadow: 0 1px 18px rgba(0, 0, 0, 0.8), 0 0 2px rgba(0, 0, 0, 0.5); }

  /* a pool of shade so the words read over bright grass and sky alike */
  #guide::before, #cap::before { content: ""; position: absolute; inset: -70px -140px -90px -160px; z-index: -1; pointer-events: none; background: radial-gradient(closest-side, rgba(4, 8, 6, 0.5), rgba(4, 8, 6, 0.28) 55%, transparent); }
  /* a line of caption is held up by a close shadow of its own, and only a breath of shade behind: on a white morning the old shade was a grey thumbprint on the picture */

  #guide.show #guideOpts button, #guide.show #guideSkip { pointer-events: auto; }
  #guideOpts button { padding: 6px 0; color: var(--ink-soft); border-bottom: 1px solid var(--ink-faint); transition: color .3s, border-color .3s; }
  #guideOpts button:hover, #guideOpts button.on { color: var(--ink); border-color: var(--ink); }

  #guideBar i { position: absolute; inset: 0; background: var(--ink); transform-origin: left; transform: scaleX(0); }

  /* a card of everything you can do, for whenever you wonder */
  #help { position: fixed; max-height: calc(100vh - var(--above-hud) - 20px); z-index: 12; left: clamp(24px, 6vw, 84px); bottom: var(--above-hud); padding: 26px 30px 24px; max-width: min(27em, calc(84vw - var(--bench-w))); box-sizing: border-box; background: rgba(8, 12, 10, 0.58); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-radius: 3px;
    opacity: 0; pointer-events: none; transition: opacity .7s ease; }

  html:is([lang="en"], [lang="vi"]) #help .row { font-family: var(--latin); font-size: 16px; letter-spacing: 0.04em; }
  #help .row button { color: var(--ink-soft); border-bottom: 1px solid var(--ink-faint); padding: 4px 0; }
  #help .row button:hover { color: var(--ink); }

  /* who else is here: one quiet line, top right */
  #roomInfo { position: fixed; right: clamp(24px, 6vw, 84px); top: clamp(20px, 5vh, 48px); font-size: 13px; letter-spacing: 0.16em; color: var(--ink-soft); text-shadow: 0 1px 12px rgba(0, 0, 0, 0.7); opacity: 0; transition: opacity 1.2s ease; pointer-events: none; }
  html:is([lang="en"], [lang="vi"]) #roomInfo { font-family: var(--latin); font-size: 16px; letter-spacing: 0.04em; }
  body.live:not(.idle):not(.bare) #roomInfo { opacity: 1; }

  /* five signs, offered above the person they are for */
  #wheel { position: fixed; left: 50%; top: 40%; transform: translate(-50%, -100%); display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 9px 14px 8px; border-radius: 26px; background: rgba(8, 12, 10, 0.5); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    opacity: 0; pointer-events: none; transition: opacity .35s ease; z-index: 9; }
  #wheel.show { opacity: 1; pointer-events: auto; }
  .pname, #wheelName, #looks .lrow.name input { font-family: var(--name) !important; font-style: normal !important; font-weight: 500; letter-spacing: 0.04em !important; }

  #wheel button:hover span, #wheel button:focus-visible span { opacity: 1; }

    opacity: 0; pointer-events: none; transition: opacity .7s ease; display: flex; flex-direction: column; gap: 18px; }
  #looks.show { opacity: 1; pointer-events: auto; }
  /* a wish: written like a slip of paper, read like one */

  #wish { position: fixed; z-index: 12; left: 0; right: 0; bottom: 0; padding: 18vh 20px calc(var(--above-hud) + 4px); box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 12px;
    background: linear-gradient(to top, rgba(5, 9, 7, 0.7) 0%, rgba(5, 9, 7, 0.42) 48%, rgba(5, 9, 7, 0) 100%); opacity: 0; pointer-events: none; transition: opacity .7s ease; }
  #wish.show { opacity: 1; } #wish.show > * { pointer-events: auto; }   /* (the shade itself lets the eyes through to the meadow) */
  body:has(#wish.show) #cap, body:has(#wish.show) #hint { opacity: 0; }
  #wishSaid { max-width: min(26em, 88vw); text-align: center; font-size: clamp(19px, 1.9vw, 26px); letter-spacing: 0.22em; line-height: 1.9; color: #fff7e2; text-shadow: 0 0 22px rgba(255, 232, 180, 0.5), 0 1px 14px rgba(0, 0, 0, 0.75); margin-bottom: 14px; }
  html:is([lang="en"], [lang="vi"]) #wishSaid { font-family: var(--latin); font-style: italic; font-size: clamp(22px, 2.1vw, 29px); letter-spacing: 0.04em; line-height: 1.5; }
  #wish .strip { position: relative; width: min(590px, 100%); transform: translateY(16px) rotate(-0.7deg); filter: drop-shadow(0 16px 24px rgba(0, 0, 0, 0.5)) drop-shadow(0 2px 3px rgba(0, 0, 0, 0.4)); transition: transform .7s cubic-bezier(.2, .7, .2, 1), filter .6s ease, opacity .5s ease; }

  /* controls: appear with the pointer, leave with it */
  /* Everything that sits "just above the bar" is placed from the bar's real height, measured as it wraps – never from a guess. */
  :root { --hud-h: 96px; --above-hud: calc(var(--hud-h) - 20px); --bench-w: 0px; }
  body.reviewing { --bench-w: min(292px, 46vw); }
  /* the bar's empty margins never take a click meant for something else; a card keeps its buttons in reach however short the window */
  #hud { pointer-events: none; z-index: 8; } #hud > * { pointer-events: auto; }
  #help, #looks { display: flex; flex-direction: column; min-width: min(15em, calc(92vw - var(--bench-w))); }
  #help dl, #looksRows { overflow-y: auto; min-height: 0; flex: 0 1 auto; }
  #help .row, #looks .row { flex: none; flex-wrap: wrap; row-gap: 6px; }

    background: linear-gradient(to top, var(--shade), transparent); font-size: 14px; letter-spacing: 0.16em; color: var(--ink-soft); opacity: 0; transition: opacity 1.2s ease; pointer-events: none; }

  #hud button:hover { color: var(--ink); }
  #hud button.on { color: var(--ink); border-bottom-color: var(--ink-faint); }
  #hud button.off { color: var(--ink-faint); text-decoration: line-through; text-decoration-color: var(--ink-faint); }

  .pc::after { content: ""; position: absolute; inset: 0; z-index: 2; background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' seed='7'/><feColorMatrix values='0 0 0 0 0.2  0 0 0 0 0.18  0 0 0 0 0.12  0 0 0 0.55 -0.12'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>"); opacity: 0.55; mix-blend-mode: multiply; pointer-events: none; }
  .pc .age, .pc .scuff { position: absolute; inset: 0; background-size: 100% 100%; pointer-events: none; }

  /* ---- the log, laid over the meadow */
  #tlog { position: fixed; inset: 0; z-index: 30; display: none; color: #e8e2d2; font-family: var(--display); font-weight: 300; }
  #tlog.show { display: block; }
  #tlog .veil { position: absolute; inset: 0; background: radial-gradient(90% 90% at 50% 46%, rgba(8, 12, 10, 0.78), rgba(6, 9, 8, 0.93)); backdrop-filter: blur(22px) saturate(0.75); -webkit-backdrop-filter: blur(22px) saturate(0.75); }
  #tlog button { cursor: pointer; }
  #tlog .tl-list { position: absolute; inset: 0; overflow-y: auto; padding: 44px clamp(24px, 4vw, 51px) 34px; box-sizing: border-box; }
  /* Nothing in the log cuts in. A card picked out of its pile rises from where it lay to the middle of the view while the
     piles sink away under it (treelog.js gives it the path); going back, the piles come up again; the lines to write
     on, and the word that it has gone, come up from below. (All of it was switched by display alone: one press, and
     the whole screen was something else.) */
  #tlog .tl-list { transition: opacity .6s ease, visibility 0s; } #tlog.one .tl-list { opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .6s ease, visibility 0s linear .6s; }
  #tlog .tl-one { position: absolute; inset: 0; opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .45s ease, visibility 0s linear .45s; }
  #tlog.one .tl-one { opacity: 1; visibility: visible; pointer-events: auto; transition: opacity .5s ease, visibility 0s; }
  #tlog.composing .compose, #tlog.sentshow .sentbox, #tlog.guest .gnote { animation: tlUp .6s cubic-bezier(.2, .7, .2, 1) both; } #tlog.one .acts, #tlog.one .count { animation: tlFade .7s ease .35s both; }
  @keyframes tlFade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes tlUp { from { opacity: 0; transform: translateX(-50%) translateY(16px); } to { opacity: 1; transform: translateX(-50%); } }
  @media (prefers-reduced-motion: reduce) { #tlog .tl-one, #tlog .tl-list { transition: none !important; } #tlog .compose, #tlog .sentbox, #tlog .gnote, #tlog .acts, #tlog .count { animation: none !important; } #tlog .turn { transition: none !important; } }
